<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>受付QRコードポスター</title>

<style>
    @page {
        size: A4;
        margin: 0;
    }

    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: #fafafa;
        text-align: center;
        color: #333;
    }

    .container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding-top: 20mm;
    }

    /* オシャレな枠（ふち） */
    .frame {
        border: 8px solid #333;
        border-radius: 25px;
        padding: 20px;
        width: 85%;
        margin: 0 auto;
        box-shadow: 0px 0px 25px rgba(0,0,0,0.15);
        background: white;
    }

    .title {
        font-size: 42px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 26px;
        margin-bottom: 20px;
    }

    /* QRコード枠 */
    .qr-box {
        background: #fff;
        padding: 20px;
        border-radius: 20px;
        width: 330px;
        margin: 20px auto;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
        border: 4px dashed #333;
    }

    .qr-box img {
        width: 300px;
        height: 300px;
    }

    .instructions {
        font-size: 22px;
        line-height: 1.7;
        margin: 20px auto;
        width: 80%;
    }
</style>
</head>

<body>
<div class="container">

    <div class="frame">

        <div class="title">受付はこちら！</div>
        <div class="subtitle">QRコードを読み込んで順番を確認できます</div>

        <div class="qr-box">
            <img src="https://ticket-number-system.onrender.com (1).png" alt="QRコード">
        </div>

        <div class="instructions">
            ・読み込むとあなたの番号が自動で発行されます<br>
            ・現在呼び出し中の番号も確認できます<br>
            ・あと何人で自分の番か分かります<br><br>
            ※QRコードは1人1回だけ読み込んでください
        </div>

    </div>

</div>
</body>
</html>
