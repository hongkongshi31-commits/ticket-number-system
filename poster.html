<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>受付QRコードポスター</title>

<style>
body {
    background-color: #FFF4A8;
    text-align: center;
    font-family: Arial, sans-serif;
    padding: 40px 20px;
}

.title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

.box {
    background: white;
    width: 90%;
    max-width: 400px;
    margin: 0 auto;
    padding: 30px 20px;
    border-radius: 20px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.15);
}

.info {
    margin-top: 20px;
    font-size: 16px;
    color: #444;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="title">3年3組<br>怪盗グルーのミニオン大救出</div>

<div class="box">
    <img src="qr.png.png" alt="QRコード" style="width: 70%; margin-bottom: 20px;">

    <div class="info">
        📱 整理券番号の呼び出し状況はこちら！<br><br>
        QRコードを読み取ると<br>
        <strong>現在呼び出し中の番号</strong> が表示されます。<br><br>
        お手元の紙の整理券の番号が<br>
        <strong>表示されている番号以下</strong> になったら<br>
        受付へお越しください。
    </div>
</div>

</body>
</html>
